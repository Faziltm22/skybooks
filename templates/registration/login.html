{% extends 'base.html' %}{% block title %}Sign in · STARNux ERP{% endblock %}{% block content %}<div class="row justify-content-center mt-5"><div class="col-md-5 col-lg-4"><div class="card p-4"><h3 class="mb-1">Welcome back</h3><p class="muted">Sign in to STARNux ERP</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label class="form-label">Username</label>{{ form.username }}<label class="form-label mt-3">Password</label>{{ form.password }}<button class="btn btn-primary w-100 mt-4">Sign in</button></form></div></div></div><script>document.querySelectorAll('input').forEach(x=>x.classList.add('form-control'))</script>{% endblock %}
