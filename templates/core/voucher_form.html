{% extends 'base.html' %}{% block content %}<h2>New voucher</h2><p class="muted">Enter matching debit and credit lines. Amounts are INR.</p><form method="post">{% csrf_token %}<div class="card p-3 mb-3"><div class="row g-3"><div class="col-md-3"><label class="form-label">Type</label><select name="voucher_type" class="form-select">{% for value,label in types %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Date</label><input type="date" name="date" value="{{ today|date:'Y-m-d' }}" class="form-control" required></div><div class="col-md-6"><label class="form-label">Narration</label><input name="narration" class="form-control" maxlength="250" required></div></div></div><div class="card p-3"><div class="table-responsive"><table class="table"><thead><tr><th>Ledger</th><th>Cost centre</th><th>Description</th><th>Debit ₹</th><th>Credit ₹</th></tr></thead><tbody>{% for i in '12345678' %}<tr><td><select name="account_{{ i }}" class="form-select"><option value="">— Select —</option>{% for a in accounts %}<option value="{{ a.pk }}">{{ a.code }} · {{ a.name }} ({{ a.get_account_type_display }})</option>{% endfor %}</select></td><td><select name="centre_{{ i }}" class="form-select"><option value="">—</option>{% for c in centres %}<option value="{{ c.pk }}">{{ c.code }}</option>{% endfor %}</select></td><td><input name="description_{{ i }}" class="form-control"></td><td><input name="debit_{{ i }}" type="number" min="0" step="0.01" class="form-control"></td><td><input name="credit_{{ i }}" type="number" min="0" step="0.01" class="form-control"></td></tr>{% endfor %}</tbody></table></div><div class="d-flex gap-2 justify-content-end"><button name="action" value="draft" class="btn btn-outline-secondary">Save draft</button><button name="action" value="post" class="btn btn-primary">Post voucher</button></div></div></form>{% endblock %}
