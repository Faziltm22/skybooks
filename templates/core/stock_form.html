{% extends 'base.html' %}{% block content %}<div class="section-label">Inventory</div><h1 class="page-title">{% if editing %}Edit stock entry{% else %}Add / remove stock{% endif %}</h1><p class="muted">Positive quantity adds stock. Mark purchased additions to track cash paid or credit still due.</p><div class="card p-4"><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Item</label><select class="form-select" name="product" required>{% for p in products %}<option value="{{ p.pk }}" {% if movement.product_id == p.pk %}selected{% endif %}>{{ p.sku }} · {{ p.name }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Condition</label><select class="form-select" name="condition"><option value="FRESH" {% if movement.condition == 'FRESH' or not movement %}selected{% endif %}>Fresh / new</option><option value="USED" {% if movement.condition == 'USED' %}selected{% endif %}>Used</option></select></div><div class="col-md-3"><label class="form-label">Date</label><input class="form-control" type="date" name="date" value="{% if movement %}{{ movement.date|date:'Y-m-d' }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}" required></div><div class="col-md-3"><label class="form-label">Quantity (+ / −)</label><input class="form-control" type="number" name="quantity" step="0.001" value="{{ movement.quantity|default:'' }}" required></div><div class="col-md-3"><label class="form-label">Unit cost ₹</label><input class="form-control" type="number" name="unit_cost" min="0" step="0.01" value="{{ movement.unit_cost|default:0 }}"></div><div class="col-md-6"><label class="form-label">Reason / reference</label><input class="form-control" name="reference" value="{{ movement.reference|default:'' }}" placeholder="Supplier, return or correction"></div><div class="col-12"><label class="form-label">Notes</label><input class="form-control" name="notes" value="{{ movement.notes|default:'' }}"></div>{% if not editing %}<div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" id="is-purchase" name="is_purchase"><label class="form-check-label fw-semibold" for="is-purchase">This stock addition is a purchase</label></div><div class="col-md-4"><label class="form-label">Total purchase amount ₹</label><input class="form-control" type="number" name="purchase_amount" min="0" step="0.01" placeholder="Defaults to quantity × unit cost"></div><div class="col-md-4"><label class="form-label">Supplier</label><input class="form-control" name="supplier"></div><div class="col-md-4"><label class="form-label">Payment</label><select class="form-select" name="purchase_method"><option value="CASH">Cash paid</option><option value="UPI">UPI paid</option><option value="BANK">Bank transfer paid</option><option value="CREDIT">Credit · pending</option></select></div>{% endif %}</div><div class="mt-4"><button class="btn btn-primary">{% if editing %}Save changed entry{% else %}Save stock movement{% endif %}</button> <a href="{% url 'inventory' %}?condition={{ movement.condition|default:'FRESH' }}" class="btn btn-light">Cancel</a></div></form></div>{% endblock %}
