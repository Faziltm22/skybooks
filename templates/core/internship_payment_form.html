{% extends 'base.html' %}{% block content %}<div class="section-label">Internship fees</div><h1 class="page-title">Record payment</h1><p class="muted">{{ record.number }} · {{ record.name }} · Remaining balance ₹{{ balance_due|floatformat:2 }}</p><div class="card p-4"><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-4"><label class="form-label">Payment date</label><input class="form-control" type="date" name="date" value="{{ today|date:'Y-m-d' }}" required></div><div class="col-md-4"><label class="form-label">Amount paid ₹</label><input class="form-control" type="number" name="amount" min="0.01" max="{{ balance_due }}" step="0.01" required></div><div class="col-md-4"><label class="form-label">Payment method</label><select class="form-select" name="payment_method">{% for value,label in payment_methods %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Receipt / transaction reference</label><input class="form-control" name="reference" maxlength="100"></div></div><div class="mt-4"><button class="btn btn-primary">Save payment</button> <a class="btn btn-light" href="{% url 'internships' %}">Cancel</a></div></form></div>{% endblock %}
