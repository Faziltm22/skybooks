{% extends 'base.html' %}{% block content %}<div class="section-label">Cashbook setup</div><h1 class="page-title">{% if category %}Edit{% else %}Add{% endif %} category</h1><div class="card p-4 mt-3" style="max-width:700px"><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Type</label><select class="form-select" name="entry_type">{% for value,label in types %}<option value="{{ value }}" {% if category.entry_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Category name</label><input class="form-control" name="name" value="{{ category.name|default:'' }}" required></div><label><input type="checkbox" name="active" {% if not category or category.active %}checked{% endif %}> Active in cashbook</label><div class="mt-4"><button class="btn btn-primary">Save category</button> <a class="btn btn-light" href="{% url 'manage_categories' %}">Cancel</a></div></form></div>{% endblock %}
