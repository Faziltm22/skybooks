{% extends 'base.html' %}{% block content %}<div class="mb-4"><div class="section-label">Internship management</div><h1 class="page-title">{% if record %}Edit internship{% else %}Add intern{% endif %}</h1><p class="muted">Track program participation, status, mentor, and fees.</p></div>{% if record %}<a class="btn btn-primary mb-3" href="{% url 'internship_payment_create' record.pk %}">＋ Record payment</a>{% endif %}<div class="card p-4"><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Intern name</label><input class="form-control" name="name" value="{{ record.name|default:'' }}" required></div><div class="col-md-6"><label class="form-label">Program</label><input class="form-control" name="program" value="{{ record.program|default:'' }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ record.email|default:'' }}"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ record.phone|default:'' }}"></div><div class="col-md-6"><label class="form-label">Mentor</label><input class="form-control" name="mentor" value="{{ record.mentor|default:'' }}"></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status">{% for val,label in statuses %}<option value="{{ val }}" {% if record.status == val or not record and val == 'APPLIED' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Start date</label><input class="form-control" type="date" name="start_date" value="{% if record %}{{ record.start_date|date:'Y-m-d' }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}" required></div><div class="col-md-6"><label class="form-label">End date</label><input class="form-control" type="date" name="end_date" value="{% if record.end_date %}{{ record.end_date|date:'Y-m-d' }}{% endif %}"></div><div class="col-md-6"><label class="form-label">Program fee ₹</label><input class="form-control" type="number" name="fee" min="0" step="0.01" value="{{ record.fee|default:0 }}"></div><div class="col-md-6"><label class="form-label">Fee paid ₹</label><input class="form-control" type="number" name="fee_paid" min="0" step="0.01" value="{{ record.fee_paid|default:0 }}"></div><div class="col-md-6"><label class="form-label">Payment date (advance or new payment)</label><input class="form-control" type="date" name="payment_date" value="{{ today|date:'Y-m-d' }}"></div><div class="col-md-6"><label class="form-label">Payment method for new advance</label><select class="form-select" name="payment_method"><option value="CASH">Cash</option><option value="UPI">UPI</option><option value="BANK">Bank transfer</option><option value="OTHER">Other</option></select></div><div class="col-md-6"><label class="form-label">Payment reference</label><input class="form-control" name="payment_reference" placeholder="Receipt or transaction reference"></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="4">{{ record.notes|default:'' }}</textarea></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save internship</button><a class="btn btn-light" href="{% url 'internships' %}">Cancel</a></div></form></div>{% endblock %}
