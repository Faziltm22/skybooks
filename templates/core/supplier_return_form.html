{% extends 'base.html' %}{% block content %}
<div class="section-label">Inventory · supplier</div><h1 class="page-title">Return stock to supplier</h1><p class="muted">Returned quantity is removed from the selected stock balance. Cash refunds are recorded as income; credit notes do not change cashbook totals.</p>
<div class="card p-4"><form method="post">{% csrf_token %}<div class="row g-3">
<div class="col-md-6"><label class="form-label">Product</label><select name="product" class="form-select" required>{% for product in products %}<option value="{{ product.pk }}">{{ product.sku }} · {{ product.name }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">Stock condition</label><select name="condition" class="form-select">{% for value,label in conditions %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">Return date</label><input type="date" name="date" class="form-control" value="{{ today|date:'Y-m-d' }}" required></div>
<div class="col-md-4"><label class="form-label">Supplier</label><input name="supplier" class="form-control" required maxlength="120"></div>
<div class="col-md-4"><label class="form-label">Quantity</label><input type="number" name="quantity" class="form-control" min="0.001" step="0.001" required></div>
<div class="col-md-4"><label class="form-label">Refund / credit amount ₹</label><input type="number" name="amount" class="form-control" min="0" step="0.01" value="0"></div>
<div class="col-md-6"><label class="form-label">Settlement</label><select name="settlement" class="form-select">{% for value,label in settlements %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div>
</div><div class="mt-4"><button class="btn btn-primary">Save supplier return</button> <a class="btn btn-light" href="{% url 'inventory' %}">Cancel</a></div></form></div>{% endblock %}
