{% extends 'base.html' %}{% block content %}<div class="mb-4"><div class="section-label">Cashbook</div><h1 class="page-title">{% if entry %}Edit entry{% else %}Add income or expense{% endif %}</h1><p class="muted">Record who, when, how, and why money moved.</p></div><div class="card p-4"><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-4"><label class="form-label">Transaction type</label><select class="form-select" name="entry_type" id="entry_type" {% if linked %}disabled{% endif %}><option value="INCOME" {% if entry.entry_type == 'INCOME' %}selected{% endif %}>Income</option><option value="EXPENSE" {% if entry.entry_type == 'EXPENSE' %}selected{% endif %}>Expense</option></select></div><div class="col-md-4"><label class="form-label">Date</label><input class="form-control" type="date" name="date" value="{% if entry %}{{ entry.date|date:'Y-m-d' }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}" required></div><div class="col-md-4"><label class="form-label">Amount ₹</label><input class="form-control" type="number" name="amount" min="0.01" step="0.01" value="{{ entry.amount|default:'' }}" required {% if amount_locked %}readonly{% endif %}></div>{% if amount_locked %}<div class="col-12"><div class="alert alert-info py-2 mb-0">{{ source_label }}</div></div>{% endif %}<div class="col-md-6"><label class="form-label">Category / type</label><select class="form-select" name="category" required><option value="">Choose category</option>{% for c in categories %}<option value="{{ c.pk }}" data-kind="{{ c.entry_type }}" {% if entry.category_id == c.pk %}selected{% endif %}>{{ c.get_entry_type_display }} · {{ c.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Reason / why</label><input class="form-control" name="reason" maxlength="200" value="{{ entry.reason|default:'' }}" placeholder="e.g. Office rent for November" required></div><div class="col-md-6"><label class="form-label">Paid to / received from</label><input class="form-control" name="party" maxlength="120" value="{{ entry.party|default:'' }}" placeholder="Person, supplier, or customer"></div><div class="col-md-6"><label class="form-label">Payment method / how</label><select class="form-select" name="payment_method">{% for val,label in payment_methods %}<option value="{{ val }}" {% if entry.payment_method == val or not entry and val == 'CASH' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Reference</label><input class="form-control" name="reference" value="{{ entry.reference|default:'' }}" placeholder="Receipt, invoice or transfer reference"></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save entry</button><a class="btn btn-light" href="{% url 'cashbook' %}">Cancel</a></div></form></div><script>const type=document.querySelector('#entry_type'),cat=document.querySelector('[name=category]');function filterCats(){[...cat.options].forEach(o=>{if(o.value)o.hidden=o.dataset.kind!==type.value})}type.addEventListener('change',filterCats);filterCats()</script>{% endblock %}
