{% extends 'base.html' %}{% block content %}<div class="section-label">Expense claims</div><h1 class="page-title">Submit an expense claim</h1><p class="muted">Claims are sent to the superadmin for review. Approved claims are recorded as cashbook expenses.</p><div class="card p-4"><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="row g-3"><div class="col-md-4"><label class="form-label">Expense date</label><input class="form-control" type="date" name="date" value="{{ today|date:'Y-m-d' }}" required></div><div class="col-md-4"><label class="form-label">Expense type</label><select class="form-select" name="category">{% for value,label in categories %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Amount ₹</label><input class="form-control" type="number" name="amount" min="0.01" step="0.01" required></div><div class="col-md-8"><label class="form-label">Reason / details</label><input class="form-control" name="reason" maxlength="200" placeholder="e.g. Client visit in Mumbai" required></div><div class="col-md-4"><label class="form-label">Vendor / paid to</label><input class="form-control" name="vendor" maxlength="120"></div><div class="col-md-6"><label class="form-label">Receipt / proof (PNG, JPG or WebP; max 8 MB)</label><input class="form-control" type="file" name="receipt" accept="image/png,image/jpeg,image/webp"></div><div class="col-md-6"><label class="form-label">Reference</label><input class="form-control" name="reference" maxlength="100" placeholder="Receipt or transaction ID"></div></div><div class="mt-4"><button class="btn btn-primary">Submit for approval</button> <a class="btn btn-light" href="{% url 'expense_claims' %}">Cancel</a></div></form></div>{% endblock %}
