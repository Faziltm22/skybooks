{% extends 'base.html' %}{% block content %}<div class="section-label">Sales log</div><h1 class="page-title">Edit sale details</h1><p class="muted">Update customer contact and payment details. Sold items and quantities stay in the sale history.</p><div class="card p-4"><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Customer name</label><input class="form-control" name="customer_name" value="{{ sale.customer_name }}"></div><div class="col-md-6"><label class="form-label">Payment type</label><select class="form-select" name="payment_type">{% for val,label in payment_types %}<option value="{{ val }}" {% if sale.payment_type == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Phone number</label><input class="form-control" type="tel" name="customer_phone" value="{{ sale.customer_phone }}"></div><div class="col-md-4"><label class="form-label">Email address</label><input class="form-control" type="email" name="customer_email" value="{{ sale.customer_email }}"></div><div class="col-md-4"><label class="form-label">Address</label><input class="form-control" name="customer_address" value="{{ sale.customer_address }}"></div><div class="col-12"><label class="form-label">Notes</label><input class="form-control" name="notes" value="{{ sale.notes }}"></div></div><button class="btn btn-primary mt-4">Save details</button> <a class="btn btn-light mt-4" href="{% url 'sales' %}">Cancel</a></form></div>{% endblock %}
